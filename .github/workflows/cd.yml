name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

##  push:
##    branches: [main]

jobs:
  Deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      
      - name: Build
        run: ./scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Set GCP Project'
        run: 'gcloud config set project hyrox-473608'
      
      - name: 'Use gcloud CLI'
        run: 'gcloud builds submit --tag europe-north2-docker.pkg.dev/hyrox-473608/hyrox-ar-repo/hyrox:latest'

      - name: 'Install goose'
        run: 'go install github.com/pressly/goose/v3/cmd/goose@latest'
      
      - name: Download Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://dl.google.com/cloudsql/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      # Step 2: Run Cloud SQL Proxy
      - name: Start Cloud SQL Proxy
        run: |
          ./cloud-sql-proxy ${{ secrets.GCLOUD_POSTGRES_CONNECTION_NAME }} --port=5432 &
      
      # Step 3: Wait for Cloud SQL Proxy to start
      - name: Wait for Cloud SQL Proxy
        run: sleep 5

      - name: "Run migrations"
        run: './scripts/migrateup.sh'

      - name: 'Deploy to Cloud Run'
        run: 'gcloud run deploy hyrox --image europe-north2-docker.pkg.dev/hyrox-473608/hyrox-ar-repo/hyrox:latest --region europe-north2 --project hyrox-473608 --allow-unauthenticated --max-instances=4'
