name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

##  push:
##    branches: [main]

jobs:
  Deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      
      - name: Build
        run: ./scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Set GCP Project'
        run: 'gcloud config set project hyrox-473608'
      
      - name: 'Use gcloud CLI'
        run: 'gcloud builds submit --tag europe-north2-docker.pkg.dev/hyrox-473608/hyrox-ar-repo/hyrox:latest'

      - name: 'Install goose'
        run: 'go install github.com/pressly/goose/v3/cmd/goose@latest'
      
      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy hyrox \
            --image europe-north2-docker.pkg.dev/hyrox-473608/hyrox-ar-repo/hyrox:latest \
            --region europe-north2 \
            --project hyrox-473608 \
            --set-env-vars \
              DB_URL="${{ secrets.DB_URL }}", \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}", \
              JWTSECRET= "${{ secrets.JWTSECRET }}", \
              SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}", \
              STRAVA_CLIENT_ID="${{ secrets.STRAVA_CLIENT_ID }}", \
            --allow-unauthenticated \
            --max-instances=4

      - name: "Run migrations"
        run: './scripts/migrateup.sh'

