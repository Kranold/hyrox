<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .createUser-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    .createUser-container h2 {
      margin: 0 0 20px;
      text-align: center;
    }

    .createUser-container input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .createUser-container button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .createUser-container button:hover {
      background-color: #0056b3;
    }

    .error {
      color: red;
      font-size: 0.9em;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="createUser-container">
    <h2>Sign up</h2>
    <form id="createUserForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="username" id="username" placeholder="Username" required />
      <textarea id="yourFitnessGoal" placeholder="Your Fitness Goal" required></textarea>
      <input type="date" id="birthday" placeholder="Your birthday" required />
      <button type="submit">Create user</button>
    </form>
    <a href="./" id="goToLogin">Go to login page</button>
      <div class="error" id="errorMessage"></div>
  </div>

  <script src="createUserApp.js"></script>
</body>

</html>
